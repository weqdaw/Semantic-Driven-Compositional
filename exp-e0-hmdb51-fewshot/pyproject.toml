[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmdb51-e0"
version = "0.1.0"
description = "Reproducible frozen CLIP few-shot HMDB51 development baseline"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<2.3", "PyYAML>=6,<7", "opencv-python-headless>=4.12,<4.13", "Pillow>=11,<12", "matplotlib>=3.10,<3.11"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
